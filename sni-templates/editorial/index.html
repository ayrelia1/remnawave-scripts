<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Вход в панель управления — Folio Access</title>
<meta name="description" content="Панель управления сайтом. Вход для администраторов.">
<meta name="application-name" content="Folio Access">
<meta property="og:type" content="website">
<meta property="og:title" content="Вход в панель управления — Folio Access">
<meta property="og:description" content="Панель управления сайтом. Вход для администраторов.">
<meta property="og:site_name" content="Folio Access">
<meta name="theme-color" content="#f1f4f7">
<link rel="icon" type="image/svg+xml" href="/identity/access-mark.svg">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="/access/styles/sign-in.css">
<script defer src="/access/scripts/sign-in.js"></script>
</head>
<body>
<a class="skip" href="#content">К содержимому</a>
<header class="access-header"><a href="/" class="access-brand"><img src="/identity/access-mark.svg" alt="" width="36" height="36"><span data-site-name>Folio Access</span></a><span class="access-caption">Управление сайтом</span></header>
<main id="content" tabindex="-1">
<section class="login-card" aria-labelledby="login-title">
<div class="access-symbol" aria-hidden="true"><svg viewBox="0 0 48 48" width="36" height="36"><rect x="12" y="21" width="24" height="19" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M17 21V14a7 7 0 0 1 14 0v7M24 28v5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></div>
<p class="eyebrow">Панель администратора</p><h1 id="login-title">Вход в систему</h1><p class="login-intro">Введите данные вашей учётной записи.</p>
<form id="login-form" autocomplete="off" novalidate>
<fieldset id="login-fields" disabled>
<label for="login-username">Логин</label>
<input id="login-username" type="text" maxlength="120" autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="login-message">
<label for="login-password">Пароль</label>
<div class="password-control"><input id="login-password" type="password" maxlength="256" autocomplete="off" aria-describedby="login-message"><button id="toggle-password" type="button" aria-pressed="false" aria-controls="login-password" aria-label="Показать пароль">Показать</button></div>
<p id="login-message" class="login-message" role="alert"></p>
<button id="sign-in" type="submit">Войти</button>
</fieldset>
</form>
<noscript><p class="no-script">Для работы формы включите JavaScript в браузере.</p></noscript>
<p class="access-help">Доступ к панели предоставляется администратором сайта.</p>
</section>
</main>
<footer><span data-site-name>Folio Access</span><span class="footer-separator" aria-hidden="true">·</span>Панель управления</footer>
</body>
</html>
